openapi: 3.0.3
info:
  title: Campus Eats API — Assignment 6
  version: 6.0.0
  description: Honest status codes, RFC 7807 Problem Details, validation, XML negotiation.
servers:
  - url: https://campuseats.example.com
security:
  - bearerAuth: []
paths:
  /orders:
    post:
      summary: Create order (201 + Location; 422 on validation)
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Order' } }
            application/xml:  { schema: { type: string } }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "406": { $ref: '#/components/responses/Problem' }
        "422": { $ref: '#/components/responses/Problem' }
  /orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: Read order (200; 404 if missing)
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/Order' } }
            application/xml:  { schema: { type: string } }
        "404": { $ref: '#/components/responses/Problem' }
        "406": { $ref: '#/components/responses/Problem' }
  /orders/{id}/cancellation:
    post:
      summary: Cancel order (200; 409 on illegal transition)
      responses:
        "200": { description: Cancelled }
        "404": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
  /rate:
    get:
      summary: Demo 429 with Retry-After
      responses:
        "429":
          description: Too Many Requests
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: RFC 7807 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    OrderCreate:
      type: object
      required: [customer, items, address]
      properties:
        customer: { type: string, minLength: 1 }
        address:  { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, qty]
            properties:
              id:  { type: string, minLength: 1 }
              qty: { type: integer, minimum: 1 }
    Order:
      type: object
      properties:
        id:       { type: integer }
        customer: { type: string }
        address:  { type: string }
        items:    { type: array, items: { type: object } }
        status:   { type: string }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:   { type: string, format: uri }
        title:  { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field:  { type: string }
              reason: { type: string }
