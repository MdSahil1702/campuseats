<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusEats — Dishes (GraphQL)</title>
<style>
  :root { --accent:#d9480f; --bg:#fff8f0; --card:#fff; --text:#2b2118; --muted:#7a6a5a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:18px 24px; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:4px 0 0; opacity:.9; font-size:.9rem; }
  main { max-width:760px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border-radius:10px; padding:16px 18px; margin-bottom:18px;
          box-shadow:0 1px 4px rgba(0,0,0,.08); }
  h2 { margin:0 0 12px; font-size:1.05rem; }
  form { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  input[type=text], input[type=number] { padding:8px 10px; border:1px solid #ccc; border-radius:6px; font-size:.95rem; }
  input[type=text] { flex:2; min-width:160px; }
  input[type=number] { flex:1; min-width:90px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px;
           font-size:.9rem; cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); padding:4px 10px; }
  button:hover { filter:brightness(1.08); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid #eee; font-size:.95rem; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase; }
  .yes { color:#2b8a3e; font-weight:600; }
  .no  { color:#c92a2a; font-weight:600; }
  #msg { min-height:1.2em; font-size:.9rem; margin-top:8px; color:var(--muted); }
  #msg.error { color:#c92a2a; }
  label.chk { font-size:.9rem; color:var(--muted); display:flex; align-items:center; gap:4px; }
</style>
</head>
<body>
<header>
  <h1>CampusEats — Dishes</h1>
  <p>Catalogue service exposed through GraphQL (Apollo Server + MySQL)</p>
</header>
<main>
  <section class="card">
    <h2>Add a dish (mutation: addDish)</h2>
    <form id="addForm">
      <input type="text" id="name" placeholder="Dish name, e.g. Paneer Roll" required>
      <input type="number" id="price" placeholder="Price" min="0" step="0.01" required>
      <label class="chk"><input type="checkbox" id="avail" checked> available</label>
      <button type="submit">Add Dish</button>
    </form>
    <div id="msg"></div>
  </section>

  <section class="card">
    <h2>Dishes (query: dishes)</h2>
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>Price (₹)</th><th>Available</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<script>
  const ENDPOINT = "/graphql";
  const $ = (id) => document.getElementById(id);

  async function gql(query, variables) {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, variables }),
    });
    const json = await res.json();
    if (json.errors) throw new Error(json.errors.map((e) => e.message).join("; "));
    return json.data;
  }

  function setMsg(text, isError = false) {
    $("msg").textContent = text;
    $("msg").className = isError ? "error" : "";
  }

  async function loadDishes() {
    const data = await gql("query { dishes { id name price available } }");
    const tbody = $("rows");
    tbody.replaceChildren();
    for (const d of data.dishes) {
      const tr = document.createElement("tr");
      const cells = [d.id, d.name, Number(d.price).toFixed(2)];
      for (const c of cells) {
        const td = document.createElement("td");
        td.textContent = c;
        tr.appendChild(td);
      }
      const tdA = document.createElement("td");
      tdA.textContent = d.available ? "Yes" : "No";
      tdA.className = d.available ? "yes" : "no";
      tr.appendChild(tdA);

      const tdB = document.createElement("td");
      const btn = document.createElement("button");
      btn.className = "secondary";
      btn.textContent = d.available ? "Mark unavailable" : "Mark available";
      btn.onclick = () => toggle(d);
      tdB.appendChild(btn);
      tr.appendChild(tdB);
      tbody.appendChild(tr);
    }
  }

  async function toggle(d) {
    try {
      await gql(
        "mutation($id: ID!, $a: Boolean!) { setDishAvailability(id: $id, available: $a) { id available } }",
        { id: d.id, a: !d.available }
      );
      setMsg(`Updated "${d.name}".`);
      await loadDishes();
    } catch (e) { setMsg(e.message, true); }
  }

  $("addForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    try {
      const input = {
        name: $("name").value,
        price: parseFloat($("price").value),
        available: $("avail").checked,
      };
      const data = await gql(
        "mutation($input: AddDishInput!) { addDish(input: $input) { id name price } }",
        { input }
      );
      setMsg(`Added "${data.addDish.name}" (id ${data.addDish.id}).`);
      $("addForm").reset();
      $("avail").checked = true;
      await loadDishes();
    } catch (e) { setMsg(e.message, true); }
  });

  loadDishes().catch((e) => setMsg("Could not load dishes: " + e.message, true));
</script>
</body>
</html>
