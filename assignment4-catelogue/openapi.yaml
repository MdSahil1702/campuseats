openapi: 3.0.3
info:
  title: CampusEats Orders Service
  version: 1.0.0
  description: Resource-oriented REST API for creating, reading, filtering and cancelling CampusEats orders.
servers:
  - url: http://localhost:5000
paths:
  /orders:
    post:
      summary: Create an order
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          headers:
            Location:
              description: URL of the newly created order
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Domain or payment refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Payments dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      summary: List orders, optionally filtered by status
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Matching orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{order_id}:
    get:
      summary: Read one order
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{order_id}/cancellation:
    post:
      summary: Cancel an order
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Current order state does not permit cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key used to safely repeat an order creation request.
      schema:
        type: string
        minLength: 8
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [PENDING, CONFIRMED, CANCELLED]
  schemas:
    CreateOrderRequest:
      type: object
      required: [customer_name, customer_email, items, total_amount, currency]
      properties:
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_amount:
          type: number
          format: double
          exclusiveMinimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
    OrderItem:
      type: object
      required: [name, quantity]
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
    Order:
      type: object
      required: [order_id, customer_name, items, total_amount, currency, status, created_at]
      properties:
        order_id:
          type: string
        customer_name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
        created_at:
          type: string
          format: date-time
    OrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
